<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流浪動物森林家</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #5C4033;
      color: white;
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-size: 50px;
    }
    @media (max-width: 768px) {
  h1 {
    font-size: 32px;
  }
  }

    .content {
      padding: 20px;
      text-align: center;
    }

.content img {
  max-width: 100%;
  height: auto;
}

    .content p {
      font-size: 24px;
    }

  ./* 按鈕基本樣式 */
btn {
  display: inline-block;
  width: 220px;
  padding: 14px 20px;

  background-color: #E53935;
  color: #FFFFFF;

  font-size: 18px;
  font-weight: 600;
  text-align: center;
  text-decoration: none;

  border-radius: 6px;
  border: none;
  box-sizing: border-box;

  transition: background-color 0.3s, transform 0.3s;
}

/* 滑鼠移上去的效果 */
.btn:hover {
  background-color: #C62828;
  transform: translateY(-2px);
}

    /* 手機版 RWD */
@media (max-width: 768px) {

  .btn {
    width: 80%;
    max-width: 280px;
    padding: 14px 20px;
    font-size: 16px;
    margin-top: 10px;
  }

}

/* 小螢幕手機 */
@media (max-width: 380px) {

  .btn {
    width: 100%;
    font-size: 15px;
  }

}
  </style>
</head>

<body>

  <header>
    <h1>流浪動物森林之家</h1>
  </header>

  <section class="content">

    <img src="https://images.unsplash.com/photo-1558788353-f76d92427f16"
         alt="狗狗">

    <p>
      我們希望幫助每一隻流浪動物找到溫暖的家。
    </p>

    <a href="#" class="btn">立即了解</a>

  </section>

</body>
</html>
