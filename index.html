<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <!-- 手機版 -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>漢堡選單</title>

  <style>
    /* 三條線 */
    .hamburger {
      width: 30px;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      height: 3px;
      background: black;
      margin: 6px 0;
    }

    /* 選單預設隱藏 */
    .menu {
      display: none;
    }

    /* 加上 show 後顯示 */
    .menu.show {
      display: block;
    }
  </style>
</head>

<body>

  <!-- 三條線 -->
  <div class="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- 選單 -->
  <nav class="menu">
    <p>首頁</p>
    <p>關於我們</p>
    <p>作品</p>
    <p>聯絡我們</p>
  </nav>

  <script>
    const hamburger = document.querySelector(".hamburger");
    const menu = document.querySelector(".menu");

    hamburger.addEventListener("click", function() {

      menu.classList.toggle("show");

    });
  </script>

</body>

</html>
