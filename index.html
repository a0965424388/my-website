```html
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>小日子咖啡店</title>

  <style>

    /* =====================
       基本設定
    ===================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --main-color: #7b4f35;
      --dark-color: #4b2e20;
      --light-color: red;
      --text-color: #333333;
      --white: #ffffff;
    }

    body {
      font-family:
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: var(--text-color);
      line-height: 1.7;
      background: red;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
    }


    /* =====================
       Header
    ===================== */

    .header {
      background: red;
      border-bottom: 1px solid #cc0000;
    }

    .nav {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover {
      color: #ffd6d6;
    }


    /* =====================
       Hero
    ===================== */

    .hero {
      background: red;
      padding: 100px 0;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 60px;
      align-items: center;
    }

    .tag {
      color: white;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hero h2 {
      color: white;
      font-size: 48px;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    .description {
      color: white;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;

      background: white;
      color: red;

      padding: 12px 25px;
      border-radius: 8px;

      text-decoration: none;
      font-weight: bold;
    }

    .btn:hover {
      background: #ffe5e5;
    }


    /* =====================
       Hero Card
    ===================== */

    .hero-card {
      background: white;

      padding: 50px 30px;

      border-radius: 20px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .hero-card span {
      font-size: 60px;
    }

    .hero-card h3 {
      margin: 10px 0;
    }


    /* =====================
       Section
    ===================== */

    .section {
      padding: 90px 0;
      background: red;
    }
```
