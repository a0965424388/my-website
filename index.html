
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紳士理髮 Barber Studio</title>

  <style>
  /* 1. 統一所有元素的尺寸計算方式 */
  * {
    box-sizing: border-box;
  }

  /* 2. 網頁基本設定 */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #333333;
  }

  /* 3. 頂部標題區 */
  header {
    width: 100%;
    background-color: #333333;
    color:white;
    padding: 24px 16px;
    text-align: center;
  }
    header h1{
      color: #D4AF37;
  }    
  
  header .subtitle {
  color: white;
  font-size: 16px;
  margin-top: 8px;
  }


  h1 {
    font-size: 36px;
  }

  /* 4. 內容區域 */
  .content {
    max-width: 800px;
    margin: auto;
    padding: 24px 16px;
    text-align: center;
  }

  /* 5. 圖片響應式設定 */
  .content img {
    display: block;
    width: 100%;
    max-width: 700px;
    height: auto;
    margin: 0 auto;
  }

  /* 6. 內文字體 */
  .content p {
    font-size: 20px;
    line-height: 1.8;
  }

  /* 7. 預約按鈕 */
  .btn {
  display: inline-block;
  background-color: #5C4033;
  color: white;
  padding: 14px 28px;
  text-decoration: none;
  border-radius: 6px;
  transition: background-color 0.3s;
}

.btn:hover {
  background-color: #3E2B22;
}

  /* 8. 手機版專用設定 */
  @media (max-width: 600px) {
    h1 {
      font-size: 28px;
      margin: 0;
    }

    .content {
      padding: 20px 16px;
    }

    .content p {
      font-size: 16px;
    }

    .btn {
      padding: 14px 24px;
    }
    /* 漢堡選單按鈕 */
.menu-toggle {
  display: none;
  background: transparent;
  border: none;
  color: #D4AF37;
  font-size: 36px;
  cursor: pointer;
}

/* 手機版顯示三條線 */
@media (max-width: 600px) {
  .menu-toggle {
    display: inline-block;
    margin-top: 12px;
  }
}

</style>
</head>

<body>
    <header>
  <h1>紳士理髮 Barber Studio</h1>
  <p class="subtitle">專業男士理髮服務</p>
  <button id="menuToggle"
          class="menu-toggle"
          type="button"
          aria-label="開啟導覽選單"
          aria-expanded="false">
     ☰
    </button> 
    <nav id="navMenu" class="nav-menu"
      <a href="services">服務項目<a/>
        <a href="booking">預約服務</a>
        <button id="translateBtn"type="button">English</button>button>
    </nav>
      
    </header>

  <main>
    <section class="content">
      <img
        src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1"
        alt="男士理髮店">

      <h2>專業剪髮服務</h2>

      <p>
        提供男士剪髮與造型服務，
        讓你展現最佳形象。
      </p>

      <a href="#contact" class="btn">預約服務</a>
    </section>

    <section id="contact" class="content">
      <h2>預約與聯絡</h2>
      <p>歡迎預約，打造專屬你的髮型。</p>
    </section>
  </main>
  <script>
const menuToggle = document.getElementById("menuToggle");
const navMenu = document.getElementById("navMenu");

menuToggle.addEventListener("click", () => {
  const isOpen = navMenu.classList.toggle("show");

  menuToggle.textContent = isOpen ? "✕" : "☰";
  menuToggle.setAttribute("aria-expanded", isOpen);
});
</script>
</body>
</html>
